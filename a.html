<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 · p5.js</title>
    <!-- 第三方库：p5.js（本地引用，离线可用） -->
    <script src="lib/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1420;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #e6edf3;
        }
        #wrap { text-align: center; }
        h1 { letter-spacing: 2px; margin: 0 0 4px; font-size: 22px; color: #7ee787; }
        #info { margin: 8px 0 12px; font-size: 14px; color: #8b949e; }
        #info b { color: #ffa657; }
        #controls { margin-top: 12px; font-size: 13px; color: #8b949e; }
        .kbd {
            background: #21262d; border: 1px solid #30363d; border-radius: 4px;
            padding: 1px 6px; font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>🐍 贪吃蛇</h1>
        <div id="info">长度 <b id="len">3</b>　·　得分 <b id="score">0</b></div>
        <main id="canvas-slot"></main>
        <div id="controls">
            方向键 / <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> 移动　·　<span class="kbd">空格</span> 开始 / 暂停　·　<span class="kbd">R</span> 重开
        </div>
    </div>

    <script>
        // ============ 贪吃蛇（p5.js）============
        const GRID = 20;          // 每格像素
        const COLS = 24;          // 列数
        const ROWS = 24;          // 行数
        const BASE_SPEED = 8;     // 初始帧数/秒（每帧走一格）
        const SPEED_STEP = 0.6;   // 每吃 3 个加速

        let snake, dir, nextDir, food, score, len, speed;
        let state = "ready";      // ready | running | paused | over
        let prevDir;

        const slot = document.getElementById("canvas-slot");
        const lenEl = document.getElementById("len");
        const scoreEl = document.getElementById("score");
        const el = (id) => document.getElementById(id);

        // p5 setup：将画布挂到指定容器
        function setup() {
            const c = createCanvas(COLS * GRID, ROWS * GRID);
            c.parent(slot);
            frameRate(BASE_SPEED);
            resetGame();
        }

        function resetGame() {
            snake = [
                { x: 8, y: 12 },
                { x: 7, y: 12 },
                { x: 6, y: 12 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            prevDir = dir;
            score = 0;
            len = 3;
            speed = BASE_SPEED;
            spawnFood();
            state = "ready";
            updateHUD();
        }

        function spawnFood() {
            let ok = false;
            while (!ok) {
                food = {
                    x: Math.floor(random(COLS)),
                    y: Math.floor(random(ROWS))
                };
                ok = !snake.some(s => s.x === food.x && s.y === food.y);
            }
        }

        function updateHUD() {
            el("len").textContent = len;
            el("score").textContent = score;
        }

        // 每帧逻辑
        function draw() {
            background("#161b27");
            drawGrid();
            drawFood();
            drawSnake();

            if (state === "running") {
                // 应用方向，禁止 180° 掉头
                if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
                    dir = { x: nextDir.x, y: nextDir.y };
                }
                step();
            } else if (state === "over") {
                drawOverlay("游戏结束", "按 R 重新开始");
            } else if (state === "paused") {
                drawOverlay("已暂停", "按空格继续");
            } else if (state === "ready") {
                drawOverlay("按 空格 开始", "方向键 / WASD 控制");
            }
        }

        function step() {
            const head = {
                x: snake[0].x + dir.x,
                y: snake[0].y + dir.y
            };

            // 撞墙
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                state = "over";
                return;
            }
            // 撞自己
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                state = "over";
                return;
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                len += 1;
                spawnFood();
                // 每吃 3 个加速（上限）
                if (len % 3 === 0 && speed < 20) {
                    speed = Math.min(20, speed + SPEED_STEP);
                    frameRate(speed);
                }
            } else {
                snake.pop();
            }
            updateHUD();
        }

        function drawGrid() {
            stroke("#1c2333");
            strokeWeight(1);
            for (let i = 0; i <= COLS; i++) {
                line(i * GRID, 0, i * GRID, height);
            }
            for (let j = 0; j <= ROWS; j++) {
                line(0, j * GRID, width, j * GRID);
            }
        }

        function drawFood() {
            noStroke();
            fill("#f85149");
            ellipse(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID * 0.75, GRID * 0.75);
        }

        function drawSnake() {
            noStroke();
            for (let i = snake.length - 1; i >= 0; i--) {
                const s = snake[i];
                const t = i / snake.length;
                fill(lerpColor(color("#2ea043"), color("#56d364"), t));
                rect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2, 4);
            }
            // 头
            const h = snake[0];
            fill("#39d353");
            rect(h.x * GRID + 1, h.y * GRID + 1, GRID - 2, GRID - 2, 4);
            // 眼睛
            fill("#0f1420");
            const ex = h.x * GRID + GRID / 2 + dir.x * 4;
            const ey = h.y * GRID + GRID / 2 + dir.y * 4;
            ellipse(ex - 3, ey, 3, 4);
            ellipse(ex + 3, ey, 3, 4);
        }

        function drawOverlay(title, sub) {
            noStroke();
            fill(0, 0, 0, 150);
            rect(0, 0, width, height);
            textAlign(CENTER, CENTER);
            textSize(30);
            fill("#ffffff");
            text(title, width / 2, height / 2 - 16);
            textSize(15);
            fill("#a5b3c4");
            text(sub, width / 2, height / 2 + 18);
        }

        // 键盘控制
        function keyPressed() {
            const k = keyCode;

            if (state === "ready" && (k === 32 || k === ENTER)) {
                state = "running";
                frameRate(speed);
                return false;
            }
            if (state === "over" && (k === 82)) {   // R
                resetGame();
                state = "running";
                frameRate(speed);
                return false;
            }
            if (k === 32) {                          // 空格：暂停/继续
                if (state === "running") {
                    state = "paused";
                } else if (state === "paused") {
                    state = "running";
                    frameRate(speed);
                }
                return false;
            }
            if (state !== "running") return false;

            // 方向
            if (k === UP_ARROW || k === 87)      setDir(0, -1);
            else if (k === DOWN_ARROW || k === 83) setDir(0, 1);
            else if (k === LEFT_ARROW || k === 65) setDir(-1, 0);
            else if (k === RIGHT_ARROW || k === 68) setDir(1, 0);
            return false;
        }

        function setDir(x, y) {
            if (x === 0 && y === 0) return;
            nextDir = { x, y };
        }
    </script>
</body>
</html>
